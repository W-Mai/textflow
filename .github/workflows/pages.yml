name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      - name: Install Trunk
        uses: jetli/trunk-action@1346cc09eace4beb84e403e199a471346d4684c9
        with:
          version: v0.21.14
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Check Playground
        run: cargo xtask check
      - name: Build Pages site
        run: cargo xtask build --public-url /textflow/
      - name: Verify artifact
        run: |
          test -s playground/dist/index.html
          test -s playground/dist/app.js
          test -s playground/dist/pkg/textflow_playground_bg.wasm
          test -s playground/dist/data/features.json
          test -s playground/dist/data/docs.json
          test -s playground/dist/textflow-logo.svg
          test -s playground/dist/textflow-icon.svg
          grep -q 'href="/textflow/.*\.css"' playground/dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
