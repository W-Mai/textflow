[package]
name = "textflow-rs"
version = "0.2.4"
edition = "2021"
rust-version = "1.85"
authors = ["Benign X <1341398182@qq.com>"]
license = "MIT"
description = "Bounded no_std Unicode text layout, bidi shaping, line breaking, and caret positioning for Rust"
repository = "https://github.com/W-Mai/textflow"
homepage = "https://github.com/W-Mai/textflow"
documentation = "https://docs.rs/textflow-rs"
readme = "README.md"
keywords = ["text", "layout", "shaping", "unicode", "no-std"]
categories = ["text-processing", "no-std", "embedded"]

[lib]
name = "textflow"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
alloc = ["shaping"]
unicode = []
bidi = ["unicode"]
shaping = ["bidi"]
complex-shaping = ["shaping"]
script-thai = ["complex-shaping"]
script-arabic = ["complex-shaping"]
script-devanagari = ["complex-shaping"]

[dependencies]
