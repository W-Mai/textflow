[package]
name = "textflow-esp32c3-demo"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
esp-bootloader-esp-idf = { version = "=0.5.0", features = ["esp32c3"] }
esp-hal = { version = "=1.1.0", features = ["esp32c3", "unstable"] }
textflow-rs = { path = "../..", default-features = false, features = ["shaping"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
