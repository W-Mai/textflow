[package]
name = "textflow-playground"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
textflow-rs = { path = "..", features = ["alloc", "script-arabic", "script-thai", "script-devanagari"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
toml = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
