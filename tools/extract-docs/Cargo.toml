[package]
name = "extract-docs"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit", "parsing", "printing", "proc-macro", "clone-impls"] }
toml = { version = "0.8", features = ["preserve_order"] }
